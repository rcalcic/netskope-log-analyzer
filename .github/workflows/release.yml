name: Build e Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Inno Setup 6 (se ausente)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Gerar pacotes
        shell: pwsh
        run: ./build.ps1 -RequireSetup

      - name: Guardar pacotes como artefato
        uses: actions/upload-artifact@v4
        with:
          name: NetskopeLogAnalyzer
          path: dist/*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Netskope Log Analyzer $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
