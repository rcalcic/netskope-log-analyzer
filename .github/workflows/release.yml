name: Build e Release (Windows)

# Toda mudança na main compila e testa. Quando o arquivo VERSION muda (ou ao
# disparar manualmente / criar tag v*), também publica a release com os pacotes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Inno Setup 6 (se ausente)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Testar e gerar pacotes
        shell: pwsh
        run: ./build.ps1 -RequireSetup

      - name: Guardar pacotes como artefato
        uses: actions/upload-artifact@v4
        with:
          name: NetskopeLogAnalyzer
          path: dist/*

      - name: Decidir se publica release
        id: rel
        shell: pwsh
        run: |
          $publish = $false
          if ($env:GITHUB_REF -like 'refs/tags/*' -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $publish = $true }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $changed = git diff --name-only HEAD~1 HEAD 2>$null
            if ($changed -contains 'VERSION') { $publish = $true }
          }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Publicar release
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'v' + (Get-Content VERSION -Raw).Trim() }
          $fence = '```'
          $notes = (Get-Content RELEASE_NOTES.md -Raw) + "`n`n### SHA-256 (para liberação pelo TI)`n$fence`n" + (Get-Content dist/SHA256SUMS.txt -Raw) + "$fence`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          $files = (Get-ChildItem dist -File).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --title "Netskope Log Analyzer $tag" --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
