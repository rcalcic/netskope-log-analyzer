name: Teste de fumaça da interface (Windows)

# 0) tela inicial (claro e escuro com sintomas marcados);
# A) pacote só de logs, tema claro, com relato do usuário (sintomas, site e horário);
# B) logs + telemetria JSONL sintéticos, tema escuro; captura todas as abas.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar o app
        shell: pwsh
        run: dotnet publish src/NetskopeLogAnalyzer/NetskopeLogAnalyzer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Abrir o app e capturar as abas
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function Capture($prefix, [string[]]$files, [string[]]$extra = @()) {
            $p = Start-Process publish/NetskopeLogAnalyzer.exe -ArgumentList (@($extra) + ($files | ForEach-Object { '"' + (Resolve-Path $_).Path + '"' })) -PassThru
            Start-Sleep 18
            if ($p.HasExited) { throw "[$prefix] o app fechou sozinho (código $($p.ExitCode))" }
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
            $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $cond)
            if (-not $win) { throw "[$prefix] janela do app não encontrada" }
            $win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Maximized)
            Start-Sleep 2
            $tabCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::TabItem)
            $tabs = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $tabCond)
            Write-Host "[$prefix] abas: $($tabs.Count)"
            $n = 1
            foreach ($t in $tabs) {
              $t.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Start-Sleep 2
              $safe = ($t.Current.Name -replace '[^\w]+', '-').Trim('-').ToLower()
              Shot ("{0}-{1:00}-{2}" -f $prefix, $n, $safe); $n++
            }
            if ($p.HasExited) { throw "[$prefix] o app fechou durante a navegação" }
            Stop-Process -Id $p.Id
            Start-Sleep 2
          }

          New-Item -ItemType Directory -Force smoke | Out-Null

          # 0) tela inicial (sem pacote)
          $p0 = Start-Process publish/NetskopeLogAnalyzer.exe -PassThru
          Start-Sleep 12
          if ($p0.HasExited) { throw '[0] o app fechou sozinho' }
          Shot '0-inicio'
          Stop-Process -Id $p0.Id; Start-Sleep 2

          # 0b) tela inicial no tema escuro, com sintomas marcados
          $p0 = Start-Process publish/NetskopeLogAnalyzer.exe -ArgumentList '--theme=escuro', '--sintomas=npa,lentidao,dns', '--site=teams.microsoft.com', '--horario=09:00' -PassThru
          Start-Sleep 12
          if ($p0.HasExited) { throw '[0b] o app fechou sozinho' }
          Shot '0b-inicio-escuro'
          Stop-Process -Id $p0.Id; Start-Sleep 2

          # A) pacote só de logs (como o usuário envia): Private Access com queda por keepalive, reautenticação e mudanças de rede
          $pa = New-Item -ItemType Directory -Force smoke/pkgA
          $N = { param($t, $lvl, $msg) "[PC-A:2026-11-23 $t.000 -03:00] t1 [$lvl] f.cpp:1:f():0x0 $msg" }
          $npa = @()
          $npa += (& $N '08:00:00' 'info' 'GW FQDN = gateway.npa.goskope.com, IP = 163.116.224.49, POP = BR-SAO1, RTT = 9 ms.')
          $npa += (& $N '08:00:01' 'info' 'Starting handler with GW gateway.npa.goskope.com (163.116.224.49:443, pop:BR-SAO1, type:GSLB, newIp:1).')
          $npa += (& $N '08:00:02' 'info' 'TLS client established connection TLS version:TLSv1.2 server:163.116.224.49:443 cipher:X')
          foreach ($k in 1..11) { $npa += (& $N ('{0:hh\:mm\:ss}' -f ([timespan]::FromMinutes(480 + 5 * $k))) 'info' ("NPAGW 163.116.224.49: RETRANS:{0}, RTT:{1}ms, HIST:(0,0,1)." -f (10 + $k * ($k -eq 11 ? 40 : 3)), ($k -eq 11 ? 640 : 12))) }
          $npa += (& $N '09:00:00' 'error' 'keepAlive fails with 15 tries.')
          $npa += (& $N '09:00:00' 'info' 'NPA Tunnel is disconnected.')
          $npa += (& $N '09:04:00' 'info' 'NPA Client is connecting to Primary Tenant.')
          $npa += (& $N '09:04:01' 'info' 'Starting handler with GW gateway.npa.goskope.com (163.116.228.122:443, pop:BR-GIG1, type:GSLB, newIp:1).')
          $npa += (& $N '09:04:02' 'info' 'TLS client established connection TLS version:TLSv1.2 server:163.116.228.122:443 cipher:X')
          $npa += (& $N '09:40:00' 'error' 'Shutdown packet received from gateway. Reason = [Active session has expired. Please Authenticate again to continue]')
          $npa += (& $N '09:40:00' 'info' 'NPA Tunnel is disconnected.')
          $npa += (& $N '09:41:00' 'info' 'TLS client established connection TLS version:TLSv1.2 server:163.116.228.122:443 cipher:X')
          $npa += (& $N '10:00:00' 'info' 'Set NPA log level to 2')
          Set-Content smoke/pkgA/npadebuglog.log $npa
          $L = { param($t, $lvl, $src, $msg) "2026/11/23 $t.100000 stAgentSvc p1 t1 $lvl $src $msg" }
          $svc = @((& $L '08:00:00' 'info' 'main.cpp:1' 'main ======= stAgentSvc 142.0.0.2821 starting ======'))
          foreach ($k in 0..59) { $svc += (& $L ('{0:hh\:mm\:ss}' -f ([timespan]::FromSeconds(28800 + 60 * $k))) 'info' 'k.cpp:1' 'KernelUserShim network status changed') }
          foreach ($k in 0..5) { $svc += (& $L ('08:59:{0:00}' -f (40 + $k * 3)) 'warn' 'nsHTTPClient.cpp:537' 'downloader curl_easy_perform failed, code 28, error Timeout was reached') }
          $svc += (& $L '10:00:00' 'info' 'x.cpp:1' 'nsAgentSvc ======= Log collection complete =======')
          Set-Content smoke/pkgA/nsdebuglog.log ($svc | Sort-Object)
          Set-Content smoke/pkgA/nsconfig.json '{"cache":{"lastClientConfigVersion":"2026-11-23 07:00:00"},"clientConfig":{"configurationName":"Default","allowClientDisabling":true,"pdem_subscription_level":"None"}}'
          Compress-Archive smoke/pkgA/* smoke/pacote-logs.zip
          Capture 'A' @('smoke/pacote-logs.zip') @('--theme=claro', '--sintomas=npa,lentidao,url', '--site=teams.microsoft.com', '--horario=09:00')

          # B) logs sintéticos + telemetria (formato JSON Lines, ainda suportado na importação) (queda de Wi-Fi às 10:09:30 seguida de timeouts)
          $pkg = New-Item -ItemType Directory -Force smoke/pkg
          $L = { param($t, $lvl, $src, $msg) "2026/11/23 $t.100000 stAgentSvc p1 t1 $lvl $src $msg" }
          $lines = @(
            (& $L '10:00:00' 'info' 'main.cpp:145' 'main ======= stAgentSvc 141.1.14.2843 starting ======'),
            (& $L '10:00:03' 'info' 'GatewaySelection.cpp:569' 'gslb [NPA]: post client rtt pop:BR-SAO1 ip:163.116.224.49 rtt:9'),
            (& $L '10:00:03' 'info' 'GatewaySelection.cpp:569' 'gslb [NPA]: post client rtt pop:BR-GIG1 ip:163.116.228.122 rtt:65'),
            (& $L '10:00:05' 'info' 'tunnel.cpp:1' 'nsTunnel flow to host: achecker-acme.goskope.com'),
            (& $L '10:00:06' 'info' 'c.cpp:825' 'clientStatusHandler [sessId 1] Caching client status, event: Tunnel Up, actor: System, time: 1, service: 1'),
            (& $L '10:02:30' 'info' 'bypassAppMgr.cpp:1720' 'BypassAppMgr bypassing flow to exception host: www.youtube.com, process: chrome, Dest IP: 1.2.3.4, Dest Port: 443, Src IP: 10.0.0.2'),
            (& $L '10:02:31' 'info' 'bypassAppMgrUDP.cpp:250' 'BypassAppMgr Blocking UDP connection from process: chrome, dest IP:142.251.154.119:443, src IP 192.168.18.13:38365'),
            (& $L '10:09:40' 'info' 'c.cpp:825' 'clientStatusHandler [sessId 1] Caching client status, event: Tunnel Down, actor: System, time: 2, service: 1'),
            (& $L '10:11:00' 'info' 'c.cpp:825' 'clientStatusHandler [sessId 1] Caching client status, event: Tunnel Up, actor: System, time: 3, service: 1'),
            (& $L '10:30:00' 'info' 'c.cpp:825' 'clientStatusHandler [sessId 1] Caching client status, event: User Disabled, actor: User, time: 4, service: 1'),
            (& $L '10:40:00' 'info' 'x.cpp:1' 'nsAgentSvc ======= Log collection complete =======')
          )
          foreach ($i in 0..5) { $lines += (& $L ('10:01:{0:00}' -f ($i * 5)) 'info' 'tunnel.cpp:1296' 'nsTunnel TLS Tunneling flow from addr: 100.65.0.2:5000, process: chrome to host: teams.microsoft.com, addr: 52.123.128.14:443 to nsProxy') }
          foreach ($i in 0..11) { $lines += (& $L ('10:10:{0:00}' -f ($i * 4)) 'warn' 'nsHTTPClient.cpp:537' 'downloader curl_easy_perform failed, code 28, error Timeout was reached') }
          Set-Content smoke/pkg/nsdebuglog.log ($lines | Sort-Object)
          Set-Content smoke/pkg/install.log "NSClient Version: 141.1.14.2843`n  PRETTY_NAME: `"Ubuntu 24.04.4 LTS`""
          $tel = New-Object System.Collections.Generic.List[string]
          $tel.Add('{"t":"2026-11-23T10:00:00-03:00","k":"meta","host":"PC-SINTETICO","os":"Windows 11 23H2","cpu":"Intel i7","cores":8,"ramMb":16000,"collector":"3.0.0","interval":30}')
          $t0 = [datetime]'2026-11-23T10:00:00'
          for ($i = 0; $i -le 80; $i++) {
            $ts = $t0.AddSeconds(30 * $i); $iso = $ts.ToString('yyyy-MM-ddTHH:mm:ss') + '-03:00'
            $spike = $ts -ge $t0.AddMinutes(9) -and $ts -le $t0.AddMinutes(11)
            $down = $ts -ge $t0.AddSeconds(570) -and $ts -lt $t0.AddSeconds(630)
            $cpu = if ($spike) { 97 } else { 18 + ($i % 7) }
            $tel.Add("{`"t`":`"$iso`",`"k`":`"cpu`",`"v`":$cpu}")
            $tel.Add("{`"t`":`"$iso`",`"k`":`"mem`",`"usedPct`":$(55 + $i % 4),`"availMb`":7000,`"totalMb`":16000}")
            if ($down) { $tel.Add("{`"t`":`"$iso`",`"k`":`"wifi`",`"connected`":false}") }
            else { $sig = if ($ts.Minute -eq 9) { 32 } else { 82 + ($i % 5) }; $tel.Add("{`"t`":`"$iso`",`"k`":`"wifi`",`"connected`":true,`"ssid`":`"Corp`",`"bssid`":`"aa:bb:cc:dd:ee:01`",`"signal`":$sig,`"rssi`":$([int]($sig/2-100)),`"rx`":866,`"tx`":780,`"band`":`"5 GHz`",`"ch`":`"36`"}") }
            $rtt = if ($down) { 380 } else { 11 + ($i % 4) }; $loss = if ($down) { 50 } else { 0 }
            $tel.Add("{`"t`":`"$iso`",`"k`":`"ping`",`"label`":`"Gateway local`",`"rtt`":$rtt,`"loss`":$loss,`"jitter`":2}")
            if ($i % 2 -eq 0) { $tel.Add("{`"t`":`"$iso`",`"k`":`"http`",`"label`":`"outlook.office.com`",`"dns`":12,`"tcp`":18,`"tls`":45,`"ttfb`":$(160 + $i % 30),`"total`":$(260 + $i % 40),`"code`":200,`"ok`":true}") }
            if ($i % 4 -eq 0) { $n = if ($spike) { 'MsMpEng' } else { 'chrome' }; $c = if ($spike) { 85 } else { 9 }; $tel.Add("{`"t`":`"$iso`",`"k`":`"procs`",`"top`":[{`"n`":`"$n`",`"cpu`":$c,`"memMb`":900},{`"n`":`"Teams`",`"cpu`":4,`"memMb`":650}]}") }
            if ($i % 10 -eq 0) { $tel.Add("{`"t`":`"$iso`",`"k`":`"disk`",`"d`":`"C:`",`"usedPct`":71,`"freeGb`":68,`"totalGb`":237}") }
          }
          $tel.Add('{"t":"2026-11-23T10:05:00-03:00","k":"trace","target":"gateway-acme.goskope.com","hops":[{"ttl":1,"ip":"192.168.0.1","rtt":2},{"ttl":2,"ip":"200.200.1.1","rtt":8},{"ttl":3,"ip":"163.116.224.49","rtt":12}]}')
          Set-Content smoke/pkg/nla-telemetry-PC-SINTETICO-20261123.jsonl $tel
          Compress-Archive smoke/pkg/* smoke/pacote-sintetico.zip
          Capture 'B' @('smoke/pacote-sintetico.zip') @('--theme=escuro', '--sintomas=semnav,maquina,wifi')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: smoke/*

      - name: Anexar resultados a uma release em rascunho
        if: always() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete smoke-screenshots -y 2>$null
          $files = (Get-ChildItem smoke -File | Where-Object { $_.Extension -in '.png', '.txt', '.jsonl' }).FullName
          if ($files) { gh release create smoke-screenshots @files --draft --title "Resultados do teste de fumaça" --notes "Gerado automaticamente; não é uma versão." }
